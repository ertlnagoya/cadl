name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The comparisons of generated Rego with the reference implementations
      # are skipped without the opa binary.
      - name: Install OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: latest

      # The comparisons of generated Cedar policies with the reference
      # decision function are skipped without the cedar binary. The archive
      # is the release of the Cedar project, pinned by its SHA-256.
      - name: Install the Cedar CLI
        env:
          CEDAR_VERSION: "4.14.1"
          CEDAR_SHA256: "5833e9f4734eac0d95b3dab7ae119a9212caf0a82e02720b989e2fce6f3bfdad"
        run: |
          name="cedar-policy-cli-x86_64-unknown-linux-gnu"
          curl -fsSL -o "$RUNNER_TEMP/cedar.tar.xz" \
            "https://github.com/cedar-policy/cedar/releases/download/cedar-policy-cli-v${CEDAR_VERSION}/${name}.tar.xz"
          echo "${CEDAR_SHA256}  $RUNNER_TEMP/cedar.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/.local/cedar"
          tar -xJf "$RUNNER_TEMP/cedar.tar.xz" -C "$HOME/.local/cedar" --strip-components=1
          echo "$HOME/.local/cedar" >> "$GITHUB_PATH"
          "$HOME/.local/cedar/cedar" --version

      # The comparisons of the exported PRISM files with Storm are skipped
      # without stormpy, which has wheels for Python 3.11 and later.
      - name: Install Storm (stormpy)
        if: ${{ matrix.python-version != '3.9' && matrix.python-version != '3.10' }}
        run: |
          pip install "stormpy==2.0.0"
          python -c "import stormpy; print('stormpy', stormpy.__version__)"

      # The comparisons of the exported PRISM files with PRISM itself are
      # skipped without the prism binary. The archive is the release of the
      # PRISM project, pinned by its SHA-256; it runs on the Java of the runner.
      - name: Install PRISM
        env:
          PRISM_VERSION: "4.11"
          PRISM_SHA256: "6d4677b6ab64daa16a8bb5ad05f79c46313ad67835cb8445ee770e7f57f611c8"
        run: |
          curl -fsSL -o "$RUNNER_TEMP/prism.tar.gz" \
            "https://github.com/prismmodelchecker/prism/releases/download/v${PRISM_VERSION}/prism-${PRISM_VERSION}-linux64-x86.tar.gz"
          echo "${PRISM_SHA256}  $RUNNER_TEMP/prism.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/prism"
          tar -xzf "$RUNNER_TEMP/prism.tar.gz" -C "$HOME/.local/prism" --strip-components=1
          (cd "$HOME/.local/prism" && ./install.sh silent)
          echo "$HOME/.local/prism/bin" >> "$GITHUB_PATH"
          java -version
          "$HOME/.local/prism/bin/prism" -version

      # -rs lists the tests that were skipped and why.
      - name: Run tests
        run: pytest -rs --cov=cadl --cov-report=term-missing --cov-report=xml tests/

      - name: Smoke-test examples
        run: |
          set -e
          for f in examples/*.cadl; do
            name=$(basename "$f" .cadl)
            echo "::group::$name"
            cadl parse "$f"
            cadl check "$f"
            cadl sim-validate "$f"
            for t in python solidity opa; do
              cadl codegen "$f" --target "$t" -o "/tmp/cadl-smoke/$name/$t"
            done
            for t in python unity go; do
              cadl sim-gen "$f" --target "$t" -o "/tmp/cadl-smoke/$name/sim.$t"
            done
            cadl verify "$f"
            echo "::endgroup::"
          done

  # The gateways against the official SDKs (tests/test_sdk_interop.py): an
  # MCP server and client of the `mcp` SDK, and an A2A agent and client of
  # `a2a-sdk`. The SDKs are test-only; cadl does not depend on them. The
  # tests are skipped in the matrix above, where they are not installed.
  sdk-interop:
    name: Gateways against the MCP and A2A SDKs (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install cadl and the SDKs
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "mcp==2.3.0" "a2a-sdk[http-server]==1.3.0" "uvicorn>=0.30" "httpx>=0.28"

      - name: Run the interoperability tests
        run: pytest -rs tests/test_sdk_interop.py tests/test_mcp_gateway.py tests/test_a2a_gateway.py

  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build backend
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Check distributions with twine
        run: python -m twine check dist/*

      - name: Upload distributions as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 14
