name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest --cov=cadl --cov-report=term-missing --cov-report=xml tests/

      - name: Smoke-test examples
        run: |
          set -e
          for f in examples/*.cadl; do
            name=$(basename "$f" .cadl)
            echo "::group::$name"
            cadl parse "$f"
            cadl check "$f"
            cadl sim-validate "$f"
            for t in python solidity opa; do
              cadl codegen "$f" --target "$t" -o "/tmp/cadl-smoke/$name/$t"
            done
            for t in python unity go; do
              cadl sim-gen "$f" --target "$t" -o "/tmp/cadl-smoke/$name/sim.$t"
            done
            cadl verify "$f"
            echo "::endgroup::"
          done

  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build backend
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Check distributions with twine
        run: python -m twine check dist/*

      - name: Upload distributions as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 14
