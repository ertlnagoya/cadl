name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The comparisons of generated Rego with the reference implementations
      # are skipped without the opa binary.
      - name: Install OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: latest

      # The comparisons of generated Cedar policies with the reference
      # decision function are skipped without the cedar binary. The archive
      # is the release of the Cedar project, pinned by its SHA-256.
      - name: Install the Cedar CLI
        env:
          CEDAR_VERSION: "4.14.1"
          CEDAR_SHA256: "5833e9f4734eac0d95b3dab7ae119a9212caf0a82e02720b989e2fce6f3bfdad"
        run: |
          name="cedar-policy-cli-x86_64-unknown-linux-gnu"
          curl -fsSL -o "$RUNNER_TEMP/cedar.tar.xz" \
            "https://github.com/cedar-policy/cedar/releases/download/cedar-policy-cli-v${CEDAR_VERSION}/${name}.tar.xz"
          echo "${CEDAR_SHA256}  $RUNNER_TEMP/cedar.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/.local/cedar"
          tar -xJf "$RUNNER_TEMP/cedar.tar.xz" -C "$HOME/.local/cedar" --strip-components=1
          echo "$HOME/.local/cedar" >> "$GITHUB_PATH"
          "$HOME/.local/cedar/cedar" --version

      # The comparisons of the exported PRISM files with Storm are skipped
      # without stormpy, which has wheels for Python 3.11 and later.
      - name: Install Storm (stormpy)
        if: ${{ matrix.python-version != '3.9' && matrix.python-version != '3.10' }}
        run: |
          pip install "stormpy==2.0.0"
          python -c "import stormpy; print('stormpy', stormpy.__version__)"

      # The comparisons of the exported PRISM files with PRISM itself are
      # skipped without the prism binary. The archive is the release of the
      # PRISM project, pinned by its SHA-256; it runs on the Java of the runner.
      - name: Install PRISM
        env:
          PRISM_VERSION: "4.11"
          PRISM_SHA256: "6d4677b6ab64daa16a8bb5ad05f79c46313ad67835cb8445ee770e7f57f611c8"
        run: |
          curl -fsSL -o "$RUNNER_TEMP/prism.tar.gz" \
            "https://github.com/prismmodelchecker/prism/releases/download/v${PRISM_VERSION}/prism-${PRISM_VERSION}-linux64-x86.tar.gz"
          echo "${PRISM_SHA256}  $RUNNER_TEMP/prism.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/prism"
          tar -xzf "$RUNNER_TEMP/prism.tar.gz" -C "$HOME/.local/prism" --strip-components=1
          (cd "$HOME/.local/prism" && ./install.sh silent)
          echo "$HOME/.local/prism/bin" >> "$GITHUB_PATH"
          java -version
          "$HOME/.local/prism/bin/prism" -version

      # tests/test_games_prism_games.py runs the export of Appendix I (I.11)
      # through PRISM-games and compares its values with `cadl game-check`.
      # The archive is the release of the PRISM-games project, pinned by its
      # SHA-256; its `prism` script goes into CADL_PRISM_GAMES, not on PATH,
      # where it would hide PRISM. One Python version is enough.
      - name: Install PRISM-games
        if: ${{ matrix.python-version == '3.12' }}
        env:
          PRISM_GAMES_VERSION: "3.2.4"
          PRISM_GAMES_SHA256: "11fb5c67d9897493588e0198d3c3fa3bbb28b4eee9b128b8d15f86b87fffec6b"
        run: |
          curl -fsSL -o "$RUNNER_TEMP/prism-games.tar.gz" \
            "https://github.com/prismmodelchecker/prism-games/releases/download/v${PRISM_GAMES_VERSION}/prism-games-${PRISM_GAMES_VERSION}-linux64-x86.tar.gz"
          echo "${PRISM_GAMES_SHA256}  $RUNNER_TEMP/prism-games.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/prism-games"
          tar -xzf "$RUNNER_TEMP/prism-games.tar.gz" -C "$HOME/.local/prism-games" --strip-components=1
          (cd "$HOME/.local/prism-games" && ./install.sh silent)
          "$HOME/.local/prism-games/bin/prism" -version
          {
            echo "CADL_PRISM_GAMES=$HOME/.local/prism-games/bin/prism"
            echo "CADL_REQUIRE_PRISM_GAMES=1"
          } >> "$GITHUB_ENV"

      # The norms monitor of the Solidity target runs on an EVM from PyPI in
      # tests/test_norms_monitor_targets.py. The EVM goes into a venv of its
      # own (CADL_EVM_PYTHON), with the versions of tests/evm-constraints.txt,
      # not into the dependencies of cadl, and solc comes from py-solc-x
      # (CADL_SOLC). CADL_REQUIRE_EVM=1 turns a missing EVM into a failure
      # of these tests instead of a skip. One Python version is enough. The
      # EVM tests take the first CADL_NORMS_EVM_CASES traces of
      # tests/test_norms_eval.py, so that the job stays short.
      - name: Set up an EVM and solc for the Solidity monitor tests
        if: ${{ matrix.python-version == '3.12' }}
        env:
          SOLCX_BINARY_PATH: ${{ runner.temp }}/solcx
        run: |
          python -m venv "$RUNNER_TEMP/venv-evm"
          "$RUNNER_TEMP/venv-evm/bin/pip" install -c tests/evm-constraints.txt "eth-tester[py-evm]" py-evm py-solc-x
          mkdir -p "$SOLCX_BINARY_PATH"
          solc=$("$RUNNER_TEMP/venv-evm/bin/python" -c "import solcx; from solcx.install import get_executable; print(get_executable(solcx.install_solc('0.8.24')))")
          "$solc" --version
          {
            echo "CADL_EVM_PYTHON=$RUNNER_TEMP/venv-evm/bin/python"
            echo "CADL_SOLC=$solc"
            echo "CADL_NORMS_EVM_CASES=40"
            echo "CADL_REQUIRE_EVM=1"
          } >> "$GITHUB_ENV"

      # -rs lists the tests that were skipped and why.
      - name: Run tests
        run: pytest -rs --cov=cadl --cov-report=term-missing --cov-report=xml tests/

      - name: Smoke-test examples
        run: |
          set -e
          for f in examples/*.cadl; do
            name=$(basename "$f" .cadl)
            echo "::group::$name"
            cadl parse "$f"
            cadl check "$f"
            cadl sim-validate "$f"
            for t in python solidity opa; do
              cadl codegen "$f" --target "$t" -o "/tmp/cadl-smoke/$name/$t"
            done
            for t in python unity go; do
              cadl sim-gen "$f" --target "$t" -o "/tmp/cadl-smoke/$name/sim.$t"
            done
            cadl verify "$f"
            echo "::endgroup::"
          done

  # The gateways against the official SDKs (tests/test_sdk_interop.py): an
  # MCP server and client of the `mcp` SDK, and an A2A agent and client of
  # `a2a-sdk`. The SDKs are test-only; cadl does not depend on them. The
  # tests are skipped in the matrix above, where they are not installed.
  sdk-interop:
    name: Gateways against the MCP and A2A SDKs (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install cadl and the SDKs
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "mcp==2.3.0" "a2a-sdk[http-server]==1.3.0" "uvicorn>=0.30" "httpx>=0.28"

      - name: Run the interoperability tests
        run: pytest -rs tests/test_sdk_interop.py tests/test_mcp_gateway.py tests/test_a2a_gateway.py

  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build backend
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Check distributions with twine
        run: python -m twine check dist/*

      - name: Upload distributions as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 14
