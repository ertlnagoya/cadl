[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cadl-lang"
dynamic = ["version"]
description = "Contract Architecture Description Language — a DSL for formally specifying, verifying, and deploying institutional designs in System of Systems"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [
    {name = "ERTL, Nagoya University"},
]
keywords = [
    "cadl",
    "dsl",
    "system-of-systems",
    "governance",
    "formal-verification",
    "multi-agent",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Compilers",
]
dependencies = [
    "lark>=1.1",
    "pyyaml>=6.0",
    "z3-solver>=4.12",
]

[project.optional-dependencies]
ai = [
    "anthropic>=0.40",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://ertlnagoya.github.io/cadl-spec/"
Documentation = "https://ertlnagoya.github.io/cadl-spec/"
Repository = "https://github.com/ertlnagoya/cadl"

[project.scripts]
cadl = "cadl.cli:main"

[tool.hatch.version]
path = "src/cadl/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cadl"]

[tool.hatch.build.targets.sdist]
include = [
    "src/cadl",
    "tests",
    "examples",
    "README.md",
    "README_ja.md",
    "LICENSE",
    "NOTICE",
    "CHANGELOG.md",
    "CITATION.cff",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
