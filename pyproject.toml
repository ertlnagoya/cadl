[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cadl"
version = "0.1.0"
description = "CADL: Contract Architecture Description Language"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = [
    "lark>=1.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.scripts]
cadl = "cadl.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
